# v* 태그를 올리면 Windows(zip, exe)와 macOS DMG(Apple Silicon, Intel)를 만들어 그 릴리스에 붙인다.
# 웹 페이지와 install.sh는 releases/latest/download/ClaudeSessionOverlay-macos-<arm64|x64>.dmg를 가리키므로 DMG 이름에는 버전을 넣지 않는다.
# 손으로 돌리면(workflow_dispatch) 릴리스에는 붙이지 않고 Actions 아티팩트로만 남긴다.
# macOS는 macOS 26 실행기(Xcode 26)에서 빌드해야 제어 센터 컨트롤이 들어간다(앱은 macOS 11부터, 위젯은 14부터 돈다).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    strategy:
      matrix:
        rid: [osx-arm64, osx-x64]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build .app and .dmg
        run: ./scripts/make-macos-app.sh ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.rid }}
          path: out/ClaudeSessionOverlay-macos-*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Build exe and zip
        shell: pwsh
        run: |
          $version = (Select-Xml -Path app/ClaudeSessionOverlay.csproj -XPath '//Version').Node.InnerText
          dotnet publish app -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force stage, dist | Out-Null
          Copy-Item publish/ClaudeSessionOverlay.exe stage/
          Copy-Item publish/ClaudeSessionOverlay.exe dist/
          Copy-Item LICENSE, README.md, README.ko.md stage/
          Copy-Item -Recurse mod stage/mod
          Compress-Archive -Path stage/* -DestinationPath "dist/ClaudeSessionOverlay-v$version-win-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
